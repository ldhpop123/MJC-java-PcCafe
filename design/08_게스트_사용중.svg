<circle cx="41" cy="644" r="9" fill="#FF3B30"/>
<text x="41" y="648" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="58" y="648" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="12.5" fill="#1D1D1F">남은 시간: TimerThread가 1초마다 감소, 5분 남으면 경고, 0이면 자동 종료</text>
