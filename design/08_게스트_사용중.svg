<text x="58" y="670" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="12.5" fill="#1D1D1F">관리자 채팅: Enter로 전송 (admin.receiveMessage)</text>
<circle cx="41" cy="688" r="9" fill="#FF3B30"/>
<text x="41" y="692" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="58" y="692" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="12.5" fill="#1D1D1F">시간 구매 / 음식 주문 → 팝업, 사용 종료 → 시간 저장 후 로그인 카드로</text>
